name: Java CI with Maven

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4   # también puedes actualizar checkout a v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar con Maven
        run: mvn -B package --file pom.xml

      - name: Ejecutar pruebas
        run: mvn test

      - name: Guardar artifact JAR
        uses: actions/upload-artifact@v4   # actualizado a v4
        with:
          name: gitactions-jar
          path: target/gitactions-*.jar

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descargar artifact JAR
        uses: actions/download-artifact@v4   # también actualizado a v4
        with:
          name: gitactions-jar
          path: target/

      - name: Crear release en GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            Release automático generado por GitHub Actions.
            Incluye el JAR compilado del microservicio.
          files: target/gitactions-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
