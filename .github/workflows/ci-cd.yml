name: CI/CD con Code Review
on:
  pull_request:
    branches: [develop]

jobs:
  # 0️. VALIDAR RAMA (NUEVO - BLOQUEA TODO)
  validate-branch:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.check.outputs.length_ok }}
    steps:
      - name: 📏 Verificar longitud rama < 64 chars
        id: check
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          LENGTH=${#BRANCH_NAME}
          
          echo "📏 Rama: '$BRANCH_NAME' → $LENGTH caracteres"
          
          if [ $LENGTH -ge 64 ]; then
            echo "❌ ERROR: Rama excede 64 caracteres"
            echo "length_ok=false" >> $GITHUB_OUTPUT
            echo ":::error::❌ Rama '$BRANCH_NAME' tiene $LENGTH chars (MAX 64)" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Rama OK: $LENGTH chars"
            echo "length_ok=true" >> $GITHUB_OUTPUT
          fi

  # 1. CODE REVIEW (Bloquea todo si falla)
  code-review:
    runs-on: ubuntu-latest
    needs: [validate-branch]           # ← DEPENDENCIA
    if: needs.validate-branch.outputs.valid == 'true'  # ← CONDICIÓN
    outputs:
      passed: ${{ steps.review.outcome == 'success' }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 🔎 Code Review (Falla → bloquea JAR)
        id: review
        run: |
          mvn clean compile \
            spotbugs:spotbugs \
            pmd:pmd \
            checkstyle:check || exit 1

      # Configurar Python 3.11
      - name: 🐍 Setup Python & Convertir XML → JSON
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Convertir XML → JSON
      - name: 🔄 Convertir XML reports a JSON
        if: always()
        run: |
          pip install xmltodict
          
          # SpotBugs → JSON (1 línea)
          python3 -c "
          import xmltodict, json
          with open('target/spotbugsXml.xml') as f:
              data = xmltodict.parse(f.read())
          with open('target/spotbugs.json', 'w') as f:
              json.dump(data, f, indent=2)
          print('✅ spotbugs.json OK')
          "
          
          # PMD → JSON (1 línea)
          python3 -c "
          import xmltodict, json
          with open('target/pmd.xml') as f:
              data = xmltodict.parse(f.read())
          with open('target/pmd.json', 'w') as f:
              json.dump(data, f, indent=2)
          print('✅ pmd.json OK')
          "
          
          # Checkstyle → JSON (1 línea)
          python3 -c "
          import xmltodict, json
          with open('target/checkstyle-result.xml') as f:
              data = xmltodict.parse(f.read())
          with open('target/checkstyle.json', 'w') as f:
              json.dump(data, f, indent=2)
          print('✅ checkstyle.json OK')
          "
          
          echo "📁 Archivos JSON generados:"
          ls -la target/*.json
      
      # Assets como Artifacts (visible inmediatamente)
      - name: 📦 Subir XML como Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-review-reports-${{ github.run_number }}
          path: |
            target/spotbugs*.xml
            target/spotbugs.json
            target/pmd.xml
            target/pmd.json
            target/checkstyle*.xml
            target/checkstyle.json
          retention-days: 7
      
      # Crear release + subir assets (YA con archivos)
      - name: 🚨 Crear Release + Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: code-review-${{ github.run_number }}
          name: "🚨 Errores Code Review #${{ github.run_number }}"
          body: |
            🔴 **Code Review FALLÓ** - Reports disponibles:
            
            📄 **XML Original**: spotbugs, pmd, checkstyle
            📊 **JSON Procesado**: spotbugs.json, pmd.json, checkstyle.json
            
            **Run**: #${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            reports/spotbugsXml.xml
            reports/spotbugs.json
            reports/pmd.xml
            reports/pmd.json
            reports/checkstyle-result.xml
            reports/checkstyle.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. BUILD JAR (SOLO si Code Review pasa ✅)
  build:
    runs-on: ubuntu-latest
    needs: code-review
    if: needs.code-review.outputs.passed == 'true'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 🏗️ Compilar JAR
        run: mvn -B clean package -DskipTests
      
      - name: 📦 Subir JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitactions-jar-${{ github.run_number }}
          path: target/gitactions-*.jar

  # 3. RELEASE JAR (SOLO si build OK) - PUBLICADO EN ASSETS
  release:
    runs-on: ubuntu-latest
    needs: [code-review, build]
    if: needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - name: 📥 Descargar JAR desde Build
        uses: actions/download-artifact@v4
        with:
          name: gitactions-jar-${{ github.run_number }}
          path: target/
      
      - name: 🚀 Crear Release JAR PÚBLICO en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          body: |
            ✅ **CI/CD COMPLETADO** - Code Review + Build OK
            
            **📦 JAR Asset disponible en Releases:**
            - `gitactions-*.jar`
            
            **Pipeline Status:**
            - Code Review: ✅ Passed
            - Build JAR: ✅ Success
            - Run Number: #${{ github.run_number }}
          draft: false      # ← PÚBLICO inmediatamente
          prerelease: false # ← Release estable
          files: |
            target/gitactions-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. COMENTARIO FINAL EN PR
  comment:
    runs-on: ubuntu-latest
    needs: [code-review, build, release]
    steps:
      - name: 💬 Status Final PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "🚦 CI/CD Pipeline Status"
          message: |
            ## 📊 **Pipeline Results**
            | Job | Status |
            |-----|--------|
            | 🔍 **Code Review** | ${{ needs.code-review.result }} |
            | 🏗️ **Build JAR** | ${{ needs.build.result || 'Bloqueado' }} |
            | 🚀 **Release** | ${{ needs.release.result || 'Bloqueado' }} |

            ${{ 
              (needs.code-review.outputs.passed == 'true' && needs.release.result == 'success') && 
              format('# ✅ **JAR PUBLICADO v1.0.{0}** 🚀 📥[![JAR Download](https://img.shields.io/badge/JAR-v1.0.{0}-brightgreen)](https://github.com/BEstr-Fullm4n/repoActionsJava/releases/tag/v1.0.{0})', github.run_number) || 
              needs.code-review.outputs.passed != 'true' && '## 🔴 **Code Review FALLÓ** → Revisa XML en Artifacts' || 
              '## ⏳ **Pipeline ejecutándose...**'
            }}


