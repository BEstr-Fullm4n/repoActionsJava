name: CI/CD con Code Review
on:
  pull_request:
    branches: [develop]

jobs:
  # 1. CODE REVIEW (Bloquea todo si falla)
  code-review:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.review.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 🔎 Code Review
        id: review
        run: |
          mvn clean compile \
            spotbugs:spotbugs \
            pmd:pmd \
            checkstyle:check
      
      - name: 📦 Subir XML Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-review-xml-reports-${{ github.run_number }}
          path: |
            target/spotbugsXml.xml
            target/pmd.xml
            target/checkstyle-result.xml
          retention-days: 7
      
      # Release SOLO si errores
      - name: 🚨 Release con Errores
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: errors-${{ github.run_number }}
          name: "🚨 Errores #${{ github.run_number }}"
          files: |
            target/spotbugsXml.xml
            target/pmd.xml
            target/checkstyle-result.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. BUILD JAR (SOLO si Code Review pasa ✅)
  build:
    runs-on: ubuntu-latest
    needs: code-review
    if: needs.code-review.outputs.passed == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 🏗️ Compilar JAR
        run: mvn -B clean package -DskipTests
      
      - name: ✅ Tests
        run: mvn test || true
      
      - name: 📦 Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: gitactions-jar-${{ github.run_number }}
          path: target/gitactions-*.jar

  # 3. RELEASE JAR (CRÍTICO: siempre ejecuta release)
  release:
    runs-on: ubuntu-latest
    needs: [code-review, build]
    if: needs.code-review.outputs.passed == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: 📥 Descargar JAR
        uses: actions/download-artifact@v4
        with:
          name: gitactions-jar-${{ github.run_number }}
          path: target/
        continue-on-error: true
      
      - name: 🚀 Crear Release JAR
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          body: |
            ✅ **CI/CD Pipeline completado**
            
            **Code Review**: ${{ needs.code-review.result }}
            **Build**: ${{ needs.build.result }}
            
            📦 **JAR**: target/gitactions-*.jar
            🔍 **XML**: code-review-xml-reports-${{ github.run_number }}
          files: |
            target/gitactions-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. COMENTARIO FINAL SIMPLIFICADO
  comment:
    runs-on: ubuntu-latest
    needs: [code-review, build, release]
    steps:
      - name: 💬 Comentar PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "🚦 CI/CD Status"
          message: |
            **Pipeline Status:**
            • Code Review: ${{ needs.code-review.result }}
            • Build JAR: ${{ needs.build.result }}
            • Release: ${{ needs.release.result }}
            
            ${{ 
              needs.code-review.outputs.passed == 'true' && 
              format('✅ **JAR publicado** → [v1.0.{0}](https://github.com/BEstr-Fullm4n/repoActionsJava/releases/tag/v1.0.{0})', github.run_number) || 
              '🔴 **Code Review falló** → Revisa XML: `code-review-xml-reports-' + github.run_number + '`'
            }}
