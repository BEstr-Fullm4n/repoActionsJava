name: CI/CD con Code Review
on:
  pull_request:
    branches: [develop]

jobs:
  # 1. CODE REVIEW (Bloquea todo si falla)
  code-review:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.review.outcome == 'success' }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 🔎 Code Review (Falla → bloquea JAR)
        id: review
        run: |
          mvn clean compile \
            spotbugs:spotbugs \
            pmd:pmd \
            checkstyle:check || exit 1
      
      - name: 📦 Subir XML Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-review-xml-${{ github.run_number }}
          path: |
            target/spotbugsXml.xml
            target/pmd.xml
            target/checkstyle-result.xml
          retention-days: 7
      
      # Release SOLO si errores (para revisión)
      - name: 🚨 Release con Errores
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: code-review-${{ github.run_number }}
          name: "🚨 Errores Code Review #${{ github.run_number }}"
          files: |
            target/spotbugsXml.xml
            target/pmd.xml
            target/checkstyle-result.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. BUILD JAR (SOLO si Code Review pasa ✅)
  build:
    runs-on: ubuntu-latest
    needs: code-review
    if: needs.code-review.outputs.passed == 'true'  # ← BLOQUEA AQUÍ
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 🏗️ Compilar JAR
        run: mvn -B clean package -DskipTests
      
      - name: ✅ Test (opcional)
        run: mvn test || true
      
      - name: 📦 Subir JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitactions-jar-${{ github.run_number }}
          path: target/gitactions-*.jar

  # 3. RELEASE JAR (SOLO si build OK)
  release:
    runs-on: ubuntu-latest
    needs: [code-review, build]
    if: needs.build.result == 'success'  # ← SOLO SI TODO PASA
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: 📥 Descargar JAR
        uses: actions/download-artifact@v4
        with:
          name: gitactions-jar-${{ github.run_number }}
          path: target/
      
      - name: 🚀 Crear Release JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          body: |
            ✅ **CI/CD COMPLETADO** - Code Review + Build + Tests OK
            
            JAR generado automáticamente.
          files: target/gitactions-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. COMENTARIO FINAL EN PR
  comment:
    runs-on: ubuntu-latest
    needs: [code-review, build, release]
    steps:
      - name: 💬 Comentar PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "🚦 CI/CD Status"
          message: |
            **Code Review**: ${{ needs.code-review.result }}
            **Build JAR**: ${{ needs.build.result || 'Bloqueado' }}
            **Release**: ${{ needs.release.result || 'Bloqueado' }}
            
            ${{(needs.code-review.result == 'success') && '✅ Todo OK → JAR en Release v1.0.' || '🔴 Code Review falló → Revisa XML en Artifacts'}}
