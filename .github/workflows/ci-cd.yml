name: CI/CD con Code Review

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write
  deployments: write

jobs:
  code-review:
    name: 🔍 Code Review
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.review.outputs.passed }}
      report: ${{ steps.review.outputs.report }}
    steps:
    - uses: actions/checkout@v4
    
    - name: 📊 Generate Code Review Report
      id: review
      run: |
        # Simular análisis de código (aquí iría tu herramienta real de code review)
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "report=✅ Code Review pasó todos los checks" >> $GITHUB_OUTPUT
        else
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "report=✅ Análisis estático completado" >> $GITHUB_OUTPUT
        fi

    - name: 📄 Upload Review Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-review-xml-reports-${{ github.run_number }}
        path: |
          *.xml
          code-review-report.json

  build:
    name: 🏗️ Build JAR
    needs: code-review
    runs-on: ubuntu-latest
    if: needs.code-review.outputs.passed == 'true'
    steps:
    - uses: actions/checkout@v4
    
    - name: 🔧 Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 📦 Build with Maven
      run: mvn clean package -DskipTests

    - name: 📁 Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: repoactionsjava-jar-${{ github.run_number }}
        path: target/*.jar

    outputs:
      jar_path: ${{ steps.build.outputs.jar_path }}

  test:
    name: 🧪 Run Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: 🔧 Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 📥 Download JAR
      uses: actions/download-artifact@v4
      with:
        name: repoactionsjava-jar-${{ github.run_number }}

    - name: 🧪 Run Maven Tests
      run: mvn test

  release:
    name: 🚀 Release JAR
    needs: [build, test, code-review]
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      needs.code-review.outputs.passed == 'true' &&
      needs.build.result == 'success' &&
      needs.test.result == 'success'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 📥 Download JAR
      uses: actions/download-artifact@v4
      with:
        name: repoactionsjava-jar-${{ github.run_number }}

    - name: 🚀 Create Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          ## 🚀 Nueva versión publicada
          
          - ✅ JAR compilado exitosamente
          - ✅ Tests aprobados
          - ✅ Code Review pasado
          - 📦 JAR disponible en Artifacts
        files: |
          *.jar

  summary:
    name: 📋 Pipeline Summary
    needs: [code-review, build, test, release]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: 📊 Generate Summary
      run: |
        echo "## 📊 **Pipeline Status**" >> $GITHUB_STEP_SUMMARY
        echo "- **Code Review**: ${{ needs.code-review.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build JAR**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Release**: ${{ needs.release.result }}" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.code-review.outputs.passed }}" == "true" ]]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **JAR publicado** → [v1.0.${{ github.run_number }}](https://github.com/BEstr-Fullm4n/repoActionsJava/releases/tag/v1.0.${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔴 **Code Review falló** → Revisa XML: [code-review-xml-reports-${{ github.run_number }}](https://github.com/BEstr-Fullm4n/repoActionsJava/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        fi

    - name: 📤 Add Summary Comment
      if: github.event_name == 'pull_request'
      run: |
        SUMMARY_MESSAGE=$(cat << EOF
        ## 🎯 **Pipeline Results** ${{ github.run_number }}

        | Job | Status |
        |-----|--------|
        | Code Review | ${{ needs.code-review.result }} |
        | Build | ${{ needs.build.result }} |
        | Tests | ${{ needs.test.result }} |
        | Release | ${{ needs.release.result }} |

        ${{ needs.code-review.outputs.passed == 'true' && format('✅ **JAR publicado** → [v1.0.%d](https://github.com/BEstr-Fullm4n/repoActionsJava/releases/tag/v1.0.%d)', github.run_number, github.run_number) || format('🔴 **Code Review falló** → Revisa: `code-review-xml-reports-%d`', github.run_number) }}
        EOF
        )
        gh pr comment ${{ github.event.pull_request.number }} --body "$SUMMARY_MESSAGE"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
