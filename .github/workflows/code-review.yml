name: Code Review

on:
  pull_request:
    branches:
      - develop

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ejecutar SpotBugs
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:4.7.3.0:spotbugs
        continue-on-error: true

      - name: Ejecutar PMD
        run: mvn pmd:pmd
        continue-on-error: true

      - name: Ejecutar Checkstyle
        run: mvn checkstyle:checkstyle
        continue-on-error: true

      - name: Publicar comentarios en el PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "🔎 Resultados del Code Review (JSON)"
          message: |
            ### SpotBugs
            Se generó el reporte en `target/spotbugs.json`.

            ### PMD
            Se generó el reporte en `target/pmd.json`.

            ### Checkstyle
            Se generó el reporte en `target/checkstyle.json`.

            ⚠️ Revisa los archivos JSON para ver los errores detectados.
            ⚠️ Si alguno de estos archivos contiene errores, corrígelos antes de hacer merge.
