name: Code Review
on:
  pull_request:
    branches: [develop]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # CORREGIDO: Ejecuta plugins correctamente
      - name: Generar reportes XML
        run: |
          mvn clean compile spotbugs:spotbugs pmd:pmd checkstyle:check
          
      - name: Verificar archivos generados
        run: |
          ls -la target/
          ls -la target/site/ || echo "No site dir"
          
      # Assets como Artifacts (visible inmediatamente)
      - name: Subir XML como Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-review-xml-reports
          path: |
            target/spotbugsXml.xml
            target/pmd.xml
            target/checkstyle-result.xml
          retention-days: 7
      
      # Opcional: Release público
      - name: Crear Release con Assets
        if: failure()  # Solo si hay errores
        uses: softprops/action-gh-release@v2
        with:
          tag_name: code-review-${{ github.run_number }}
          name: "Code Review #${{ github.run_number }}"
          draft: false  # Público
          prerelease: false
          files: |
            target/spotbugsXml.xml
            target/pmd.xml
            target/checkstyle-result.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
