name: Code Review

on:
  pull_request:
    branches:
      - develop

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ejecutar SpotBugs
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:4.7.3.0:spotbugs
        continue-on-error: true

      - name: Ejecutar PMD
        run: mvn pmd:pmd
        continue-on-error: true

      - name: Ejecutar Checkstyle
        run: mvn checkstyle:checkstyle
        continue-on-error: true

      - name: Instalar xml2json
        run: npm install -g xml-js

      - name: Convertir reportes XML a JSON
        run: |
          if [ -f target/spotbugsXml.xml ]; then
            npx xml2json target/spotbugsXml.xml --compact --spaces 2 > target/spotbugs.json
          fi
          if [ -f target/pmd.xml ]; then
            npx xml2json target/pmd.xml --compact --spaces 2 > target/pmd.json
          fi
          if [ -f target/checkstyle-result.xml ]; then
            npx xml2json target/checkstyle-result.xml --compact --spaces 2 > target/checkstyle.json
          fi

      - name: Publicar comentarios en el PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "🔎 Resultados del Code Review (JSON)"
          message: |
            Los reportes se generaron en formato JSON y fueron adjuntados al Release:
            - spotbugs.json
            - pmd.json
            - checkstyle.json

            ⚠️ Revisa los archivos en la sección **Assets** del Release para ver los errores detectados.
            ⚠️ Si alguno de estos archivos contiene errores, corrígelos antes de hacer merge.

      - name: Adjuntar reportes JSON al Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: code-review-${{ github.run_number }}
          name: "Code Review Report ${{ github.run_number }}"
          body: |
            Reportes automáticos de calidad de código generados por GitHub Actions.
            Incluye SpotBugs, PMD y Checkstyle en formato JSON.
          files: |
            target/spotbugs.json
            target/pmd.json
            target/checkstyle.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
