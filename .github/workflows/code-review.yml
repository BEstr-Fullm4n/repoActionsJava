name: Code Review
on:
  pull_request:
    branches: [develop]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Generar reportes JSON
        run: |
          mvn clean compile spotbugs:spotbugs pmd:pmd checkstyle:check
      
      - name: Verificar archivos JSON
        run: |
          ls -la target/*.json || echo "No JSON files found"
      
      - name: Subir JSON como Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-review-json-reports
          path: |
            target/spotbugs.json
            target/pmd.json
            target/checkstyle.json
          retention-days: 7
      
      - name: Crear Release con JSON
        if: always()  # Siempre se ejecuta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: code-review-${{ github.run_number }}
          name: "Code Review JSON #${{ github.run_number }}"
          draft: false
          files: |
            target/spotbugs.json
            target/pmd.json
            target/checkstyle.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Comentar PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "🔎 Code Review JSON"
          message: |
            ✅ **Reportes JSON generados** y disponibles en:
            • Artifacts: `code-review-json-reports`
            • Release: `code-review-${{ github.run_number }}`
            
            📥 Descarga los JSON para revisar errores detallados.
